services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: lms
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/lms
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: {}
